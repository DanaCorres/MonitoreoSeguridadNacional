name: Verificar fuentes

# Córrelo a mano (pestaña Actions > Verificar fuentes > Run workflow) la
# primera vez y cada vez que agregues medios. No cambia nada del panel: solo
# imprime en el log qué medio responde y cuál no.
on:
  workflow_dispatch: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/verificar_fuentes.py
