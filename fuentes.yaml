# ===========================================================================
# Panel nacional de seguridad — configuración
# ===========================================================================
# Este es el único archivo que necesitas editar para el día a día:
#   - "ajustes": horarios, topes y modelo.
#   - "filtro": palabras que deciden qué titulares llegan a Claude.
#   - "fuentes": la lista de medios.
# ===========================================================================

ajustes:
  # Descargas simultáneas. Con ~250 medios, de uno en uno la corrida pasaría
  # del límite de tiempo de GitHub; en paralelo tarda unos pocos minutos.
  hilos: 12
  # Segundos de espera por medio antes de darlo por caído.
  timeout: 20
  # Titulares máximos que se toman de cada medio por corrida.
  max_por_fuente: 30

  # Respaldo por Google Noticias: si un medio no trajo nada por su propia
  # página (caído, bloqueado, sin RSS), se busca en Google Noticias
  # "site:dominio + palabras de seguridad". La liga pasa por news.google.com.
  google_respaldo: true
  # Cuántos dominios se juntan en una sola consulta a Google Noticias.
  # Menos consultas = menos riesgo de que Google limite al panel.
  medios_por_consulta_google: 4
  hilos_google: 2

  # Días que el panel recuerda una liga para no mostrarla como nueva.
  dias_historial: 10

  # --- Curaduría con Claude -------------------------------------------------
  modelo: claude-haiku-4-5-20251001
  # Titulares por llamada al modelo.
  lote_ia: 60
  # Llamadas simultáneas al modelo.
  hilos_ia: 4
  max_tokens_ia: 8192
  # Notas máximas que se acumulan por estado en el día. Si se llena, se quedan
  # las de relevancia alta y las más recientes.
  max_por_estado: 30

# ---------------------------------------------------------------------------
# Filtro previo (antes de Claude)
# ---------------------------------------------------------------------------
# Un titular pasa a Claude si contiene al menos una expresión de "incluir" y
# ninguna de "excluir". Se comparan en minúsculas y SIN acentos, así que
# escribe "fiscalia", no "fiscalía". Son expresiones regulares: \b marca
# inicio o fin de palabra.
#
# Este filtro es a propósito amplio: deja pasar de más y Claude descarta lo
# que no es seguridad. Si algo importante no está llegando, agrega aquí la
# palabra. Las secciones policiacas (OEM, "pagina" de policiaca/justicia) y
# lo que llega por Google Noticias no pasan por este filtro: ya vienen
# filtrados de origen.
filtro:
  incluir:
    # Homicidios
    - 'homicid'
    - 'asesin'
    - 'feminicid'
    - '\bmat(a|an|aron|o)\b'
    - 'ejecut'
    - 'sin vida'
    - 'cadaver'
    - '\bcuerpos?\b'
    - 'restos (humanos|oseos)'
    - '\bmuert[oa]s?\b'
    - '\bmuere'
    - 'fallec'
    - 'victimas?'
    # Violencia y crimen organizado
    - 'balacera'
    - 'balea'
    - 'balazo'
    - 'disparo'
    - 'ataque armado'
    - 'armad[oa]s'
    - 'enfrentamiento'
    - 'sicari'
    - 'cartel'
    - '\bnarco'
    - 'crimen organizado'
    - 'delincuen'
    - 'criminal'
    - 'celula'
    - 'huachicol'
    - 'fentanil'
    - 'metanfetamina'
    - 'cocaina'
    - 'marihuana'
    - '\bdroga'
    - 'narcomenud'
    - 'laboratorio clandestino'
    - 'pandill'
    - '\brina\b'
    - 'golpiza'
    - 'violencia'
    # Delitos
    - 'delito'
    - '\brob(o|a|an|aron)\b'
    - 'asalt'
    - 'extorsi'
    - 'cobro de piso'
    - 'secuestr'
    - 'levanton'
    - 'fraude'
    - 'despojo'
    - 'violacion'
    - 'abuso sexual'
    - 'trata de personas'
    - 'amenaza'
    # Desaparecidos
    - 'desapareci'
    - 'desaparicion'
    - 'no localizad'
    - 'ficha de busqueda'
    - 'buscadoras'
    - 'colectivo'
    - '\bfosas?\b'
    - 'alerta amber'
    # Justicia
    - 'fiscal'
    - 'ministerio publico'
    - 'detien'
    - 'detenid'
    - 'detencion'
    - 'captur'
    - 'aprehen'
    - 'arrest'
    - 'vincula(n|do|da)? a proceso'
    - 'sentenci'
    - 'condena'
    - 'prision'
    - 'penal\b'
    - 'cereso'
    - 'reclusorio'
    - 'imputad'
    - 'extradi'
    - '\bjuez'
    # Política de seguridad
    - 'seguridad'
    - 'polici'
    - 'guardia nacional'
    - 'sedena'
    - 'semar'
    - 'ejercito'
    - 'militar'
    - 'operativo'
    - 'cateo'
    - 'asegur'
    - 'decomis'
    - 'sesnsp'
    - 'harfuch'
    # Accidentes viales
    - 'accidente'
    - 'choque'
    - '\bchoca'
    - 'volcadura'
    - '\bvuelca'
    - 'atropell'
    - 'percance'
    - 'carambola'
    - 'lesionad'
    - 'herid[oa]s?'
  excluir:
    - 'horoscop'
    - 'receta'
    - 'netflix'
    - 'pelicula'
    - 'telenovela'
    - 'pronostico del clima'
    - 'seguridad social'
    - 'ciberseguridad'
    - 'aniversario luctuoso'

# ---------------------------------------------------------------------------
# Palabras que se agregan a las consultas de Google Noticias. Google busca
# también en el texto de la nota, no solo en el titular, así que con pocas
# palabras bien elegidas alcanza. No pongas más de ~15: la consulta se vuelve
# demasiado larga y Google la recorta.
# ---------------------------------------------------------------------------
google_palabras:
  - homicidio
  - asesinan
  - feminicidio
  - balacera
  - detienen
  - fiscalía
  - secuestro
  - extorsión
  - desaparecidos
  - cártel
  - sentencia
  - accidente
  - robo
  - '"sin vida"'

